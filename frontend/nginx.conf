server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API aynı origin üzerinden proxy'lenir. Tarayıcı yine de POST isteklerinde
    # Origin başlığı gönderdiği için bu adres backend'in izin listesinde olmalı
    # (ucmd.cors.allowed-origins).
    location /api/ {
        proxy_pass http://ucmd-backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pahalı metrik çağrıları backend'de 15 sn'ye kadar sürebiliyor
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # SPA: bilinmeyen yollar index.html'e düşer (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash'li asset'ler uzun süre cache'lenebilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
