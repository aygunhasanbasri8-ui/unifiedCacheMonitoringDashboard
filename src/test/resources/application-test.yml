# Test profili — H2 in-memory, kısa koruma limitleri.
# Redis/Hazelcast bean'leri lazy bağlandığı için gerçek sunucu gerekmez.

spring:
  datasource:
    url: jdbc:h2:mem:ucmd_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

ucmd:
  cache:
    ttl-seconds: 1
    stale-ttl-minutes: 5
    max-size: 100

  protection:
    cheap-timeout-ms: 500
    expensive-timeout-ms: 1000

logging:
  level:
    root: WARN
    com.nkolay: WARN