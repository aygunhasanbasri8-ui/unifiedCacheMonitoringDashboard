spring:
  application:
    name: ucmd

  lifecycle:
    timeout-per-shutdown-phase: 30s

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ucmd_db}
    username: ${SPRING_DATASOURCE_USERNAME:ucmd_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ucmd_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 5000ms
      ssl:
        enabled: false
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms
        shutdown-timeout: 200ms

hazelcast:
  cluster-name: ${HAZELCAST_CLUSTER_NAME:dev}
  members: ${HAZELCAST_MEMBERS:localhost:5701}
  username: ${HAZELCAST_USERNAME:}
  password: ${HAZELCAST_PASSWORD:}
  tls-enabled: ${HAZELCAST_TLS_ENABLED:false}
  metrics-urls: http://localhost:9404/metrics, http://localhost:9405/metrics

app:
  environment: ${APP_ENVIRONMENT:development}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}

server:
  port: 8080
  servlet:
    context-path: /api
  shutdown: graceful

logging:
  level:
    root: INFO
    com.nkolay: DEBUG


management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ucmd

ucmd:
  key-patterns:
    # ── Kritik hot field'lar (en spesifik — önce gelmeli) ──
    - pattern: "ucmd:merchant:*:commission"
      label: "Komisyon Oranları"
    - pattern: "ucmd:merchant:*:status"
      label: "Üye İşyeri Durumları"
    - pattern: "ucmd:merchant:*:risk"
      label: "Risk Skorları"
    - pattern: "ucmd:merchant:*:settlement"
      label: "Valör Periyotları"
    - pattern: "ucmd:merchant:*:dailyvolume"
      label: "Günlük İşlem Hacimleri"
    - pattern: "ucmd:merchant:*:dailycount"
      label: "Günlük İşlem Adetleri"
    - pattern: "ucmd:merchant:*:terminals"
      label: "Üye İşyeri Terminal Listeleri"

    # ── Terminal hot field'ları ──
    - pattern: "ucmd:terminal:*:status"
      label: "Terminal Durumları"
    - pattern: "ucmd:terminal:*:daily"
      label: "Terminal Günlük Aktiflik"
    - pattern: "ucmd:terminal:*:lasttx"
      label: "Terminal Son İşlem Zamanları"

    # ── İşlem özetleri ──
    - pattern: "ucmd:transaction:daily:*"
      label: "Günlük İşlem Özetleri"

    # ── Listeler (gruplu görünümler) ──
    - pattern: "ucmd:merchantlist:status:*"
      label: "Üye İşyeri Durum Listeleri"
    - pattern: "ucmd:merchantlist:city:*"
      label: "Şehir Bazlı Listeler"
    - pattern: "ucmd:merchantlist:sector:*"
      label: "Sektör Bazlı Listeler"
    - pattern: "ucmd:merchantlist:highrisk"
      label: "Yüksek Riskli İşyerleri"
    - pattern: "ucmd:terminallist:status:*"
      label: "Terminal Durum Listeleri"
    - pattern: "ucmd:terminallist:daily:*"
      label: "Terminal Aktiflik Listeleri"

    # ── İstatistikler ──
    - pattern: "ucmd:stats:sector:*"
      label: "Sektör İstatistikleri"
    - pattern: "ucmd:stats:daily:*"
      label: "Global Günlük İstatistikler"

    # ── Tam kayıtlar (genel — hot field'lardan SONRA gelmeli) ──
    - pattern: "ucmd:merchant:*"
      label: "Üye İşyeri Kayıtları (tam)"
    - pattern: "ucmd:terminal:*"
      label: "Terminal Kayıtları (tam)"
    - pattern: "ucmd:merchantlist:*"
      label: "Diğer İşyeri Listeleri"
    - pattern: "ucmd:terminallist:*"
      label: "Diğer Terminal Listeleri"
    - pattern: "ucmd:transaction:*"
      label:  "Transaction Kayıtları (tam)"

    # ── Eski/test key'leri (Hazelcast feeder veya manuel testler) ──
    - pattern: "ucmd-*"
      label: "Hazelcast IMap'leri"
    - pattern: "ucmd:session:*"
      label: "Oturumlar"
    - pattern: "ucmd:user:*"
      label: "Kullanıcılar"