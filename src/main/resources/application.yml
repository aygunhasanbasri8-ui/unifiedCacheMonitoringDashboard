spring:
  application:
    name: ucmd

  lifecycle:
    timeout-per-shutdown-phase: 30s

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ucmd_db}
    username: ${SPRING_DATASOURCE_USERNAME:ucmd_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ucmd_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 5000ms
      ssl:
        enabled: false
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms
        shutdown-timeout: 200ms

hazelcast:
  cluster-name: ${HAZELCAST_CLUSTER_NAME:dev}
  members: ${HAZELCAST_MEMBERS:localhost:5701}
  username: ${HAZELCAST_USERNAME:}
  password: ${HAZELCAST_PASSWORD:}
  tls-enabled: ${HAZELCAST_TLS_ENABLED:false}

app:
  environment: ${APP_ENVIRONMENT:development}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}

server:
  port: 8080
  servlet:
    context-path: /api
  shutdown: graceful

logging:
  level:
    root: INFO
    com.nkolay: DEBUG


management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ucmd

ucmd:
  key-patterns:
    - pattern: "ucmd:merchant:*"
      label: "Üye İşyeri Kayıtları"
    - pattern: "ucmd:merchantlist:city:*"
      label: "Şehir Listeleri"
    - pattern: "ucmd:merchantlist:sector:*"
      label: "Sektör Listeleri"
    - pattern: "ucmd:merchantlist:status:*"
      label: "Askıdaki Üye İşyerleri"
    - pattern: "ucmd:merchantlist:status:SUSPENDED"
      label: "Diğer Listeler"
    - pattern: "ucmd:session:*"
      label: "Oturumlar"
    - pattern: "ucmd:user:*"
      label: "Kullanıcılar"