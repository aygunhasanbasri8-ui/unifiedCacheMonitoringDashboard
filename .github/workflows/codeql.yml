name: CodeQL

on:
  push:
    branches: [main, claude]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin
          - javascript-typescript
          - python
    steps:
      - uses: actions/checkout@v4
      # build-mode none: Java da derlemeden taranıyor, Maven/Docker kurulumu gerekmiyor
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
