$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "monitor",
      "password": "dev_password_123_change_me"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.environment.set("token", json.token);

      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Token bos degil", () => pm.expect(json.token).to.not.be.empty);
      pm.test("Rol MONITOR", () => pm.expect(json.role).to.eql("MONITOR"));
    language: text/javascript
order: 1000
