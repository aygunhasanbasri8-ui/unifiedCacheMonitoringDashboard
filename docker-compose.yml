services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ucmd-net

  hazelcast:
    image: hazelcast/hazelcast:5.3.8
    container_name: hazelcast
    ports:
      - "5701:5701"
      - "9404:9404"

    environment:
      HZ_CLUSTERNAME: dev
      JAVA_OPTS: "-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=9404:/opt/jmx/config.yaml"
    volumes:
      - ./jmx:/opt/jmx:ro
    networks:
      - ucmd-net

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ucmd_db
      POSTGRES_USER: ucmd_user
      POSTGRES_PASSWORD: ucmd_pass
    networks:
      - ucmd-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - ucmd-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    networks:
      - ucmd-net

networks:
  ucmd-net:
    driver: bridge