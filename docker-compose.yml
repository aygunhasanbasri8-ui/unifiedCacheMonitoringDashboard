services:
  redis:
    image: redis:7
    container_name: redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - ucmd-net

  redis-2:
    image: redis:7
    container_name: redis-2
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    networks:
      - ucmd-net

  hazelcast:
    image: hazelcast/hazelcast:5.3.8
    container_name: hazelcast
    ports:
      - "5701:5701"
      - "9404:9404"
    environment:
      HZ_NETWORK_PUBLICADDRESS: "hazelcast:5701"
      JAVA_OPTS: "-Dhazelcast.config=/opt/hazelcast/config/hazelcast.xml -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=9404:/opt/jmx/config.yaml"
    volumes:
      - ./jmx:/opt/jmx:ro
      - ./hazelcast/hazelcast.xml:/opt/hazelcast/config/hazelcast.xml:ro
    networks:
      - ucmd-net

  hazelcast-2:
    image: hazelcast/hazelcast:5.3.8
    container_name: hazelcast-2
    ports:
      - "5702:5701"
      - "9405:9404"
    environment:
      HZ_NETWORK_PUBLICADDRESS: "hazelcast-2:5701"
      JAVA_OPTS: "-Dhazelcast.config=/opt/hazelcast/config/hazelcast.xml -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=9404:/opt/jmx/config.yaml"
    volumes:
      - ./jmx:/opt/jmx:ro
      - ./hazelcast/hazelcast.xml:/opt/hazelcast/config/hazelcast.xml:ro
    networks:
      - ucmd-net

  hz-analytics:
    image: hazelcast/hazelcast:5.3.8
    container_name: hz-analytics
    ports:
      - "5703:5701"
      - "9406:9404"
    environment:
      HZ_NETWORK_PUBLICADDRESS: "hz-analytics:5701"
      JAVA_OPTS: "-Dhazelcast.config=/opt/hazelcast/config/hazelcast.xml -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=9404:/opt/jmx/config.yaml"
    volumes:
      - ./jmx:/opt/jmx:ro
      - ./hazelcast/hazelcast-analytics.xml:/opt/hazelcast/config/hazelcast.xml:ro
    networks:
      - ucmd-net

  postgres:
    image: postgres:15
    container_name: ucmd-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ucmd_db
      POSTGRES_USER: ucmd_user
      POSTGRES_PASSWORD: ucmd_pass
    volumes:
      - ucmd-pgdata:/var/lib/postgresql/data
    networks:
      - ucmd-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - ucmd-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    networks:
      - ucmd-net

volumes:
  ucmd-pgdata:
networks:
  ucmd-net:
    driver: bridge